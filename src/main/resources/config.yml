# Language / Sprache
#   de, en       – global language for all players
#   auto         – each player sees text in their Minecraft client language
#                  (falls back to English if the language is not available)
# Custom files can be placed in plugins/Deathrun/lang/
language: de

# Maximum deviation in blocks east/west from the start point
corridor-width: 30

# Countdown in seconds before the race starts
countdown: 10

# Name displayed in the scoreboard title
server-name: "DeathRun"

# Run direction: NORTH, SOUTH, EAST or WEST
direction: NORTH

# Allow PVP between players (false = no player-vs-player damage)
pvp: false

# Seconds after race start before PVP is activated (0 = immediately at start)
pvp-delay: 30

# Seconds of countdown shown at the end of the PVP delay
# Example: pvp-delay=30, pvp-countdown=5 → countdown starts at second 25
pvp-countdown: 5

# Maximum race time in seconds (0 = no limit, timer only counts up)
max-time: 0

# Damage per block outside the border, per second
border-damage-per-block: 0.5
# How many blocks outside the border before damage begins (0 = immediately)
border-damage-buffer: 0.0

# Measurement start point (outer edge of cage wall in run direction – set automatically)
start:
  world: ""
  x: 0
  y: 64
  z: 0

# Spawn centre of the cage (set automatically)
spawn:
  world: ""
  x: 0
  y: 64
  z: 0

# Cage settings
cage:
  # Radius of the glass cage (in blocks, effective width = radius * 3)
  radius: 3
  # Set automatically – true when a cage is present in the world
  built: false
