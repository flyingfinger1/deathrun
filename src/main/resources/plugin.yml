name: Deathrun
version: '1.0'
main: de.flyingfinger.minecraft.deathrun.DeathrunPlugin
api-version: '1.21.8'
description: Deathrun Minigame – Wettlauf mit permanentem Lebensverlust
authors:
  - Du

commands:
  dr:
    description: Deathrun Hauptbefehl
    usage: /dr <subbefehl>

permissions:
  deathrun.admin:
    description: Voller Zugriff auf alle Deathrun-Befehle
    default: op
  deathrun.goto:
    description: Teleportation zum Gewinner-Ort nach dem Spiel
    default: true
