name: Deathrun
version: '1.0.1'
main: de.flyingfinger.minecraft.deathrun.DeathrunPlugin
api-version: '1.16'
description: Deathrun Minigame – Race with permanent health loss
authors:
  - Du

commands:
  dr:
    description: Deathrun main command
    usage: /dr <subcommand>

permissions:
  deathrun.admin:
    description: Full access to all Deathrun commands
    default: op
  deathrun.goto:
    description: Teleport to the winner's location after the game
    default: true
